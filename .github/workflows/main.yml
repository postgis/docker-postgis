name: Test PostGIS images

on:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:

  versions:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: matrix
        run: |
          python3 - <<'PYTHON' >> "$GITHUB_OUTPUT"
          import json
          import re
          from pathlib import Path

          images = []
          for dockerfile in sorted(Path('.').glob('*/Dockerfile')):
              postgres, postgis = dockerfile.parent.name.split('-', 1)
              for variant, path in (('default', dockerfile), ('alpine', dockerfile.parent / 'alpine/Dockerfile')):
                  if not path.is_file():
                      continue
                  versions = re.findall(r'(?m)^(?:ARG|ENV) POSTGIS_(?:SOURCE_)?VERSION=([^\s]+)', path.read_text())
                  experimental = any(re.search(r'alpha|beta|rc|master', value, re.I) for value in (postgres, postgis, *versions))
                  for runner in ('ubuntu-24.04', 'ubuntu-24.04-arm'):
                      images.append({'postgres': postgres, 'postgis': postgis, 'variant': variant,
                                     'runner-platform': runner, 'experimental': experimental})
          print('matrix=' + json.dumps({'include': images}, separators=(',', ':')))
          PYTHON

  make-docker-images:
    needs: versions
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    name: ${{ matrix.postgres }}-${{ matrix.postgis }}-${{ matrix.variant }} ${{ matrix.runner-platform }} - Build Docker image
    runs-on: ${{ matrix.runner-platform }}
    continue-on-error: ${{ matrix.experimental }}
    env:
      VERSION: ${{ format('{0}-{1}', matrix.postgres, matrix.postgis) }}
      VARIANT: ${{ matrix.variant }}
      DOCKER_APT_PKG_VER: '5:29.8.2-1~ubuntu.24.04~noble'

    steps:
    - name: Install/config specific version of Docker packages
      run: |
        echo "***** Removing any currently installed conflicting packages..."
        for pkg in docker.io docker-doc docker-compose docker-compose-v2 podman-docker containerd runc; do sudo apt-get remove $pkg; done
        echo "***** Setting up Docker's APT repo..."
        sudo apt-get update
        sudo apt-get install ca-certificates curl
        sudo install -m 0755 -d /etc/apt/keyrings
        sudo curl --fail --silent --show-error --location --retry 5 --retry-delay 2 --retry-connrefused https://download.docker.com/linux/ubuntu/gpg -o /etc/apt/keyrings/docker.asc
        sudo chmod a+r /etc/apt/keyrings/docker.asc
        echo \
          "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu \
          $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | \
          sudo tee /etc/apt/sources.list.d/docker.list > /dev/null
          sudo apt-get update
        echo "*****  Check available docker-ce versions ."
        sudo apt policy docker-ce
        echo "***** Installing Docker packages..."
        sudo apt-get install docker-ce=${{ env.DOCKER_APT_PKG_VER }} docker-ce-cli=${{ env.DOCKER_APT_PKG_VER }} containerd.io docker-buildx-plugin docker-compose-plugin
        echo "***** Verifying initial Docker installation..."
        docker run hello-world
        echo "***** Displaying Docker information..."
        docker info
        echo "***** Configuring Docker for containerd image store and builder keepStorage..."
        echo "{ \"features\": { \"containerd-snapshotter\": true }}" | sudo tee /etc/docker/daemon.json
        echo $'{
          "features": {
            "containerd-snapshotter": true
          },
          "builder": {
            "gc": {
              "defaultKeepStorage": "20GB",
              "enabled": true
            }
          }
        }' | sudo tee /etc/docker/daemon.json
        sudo systemctl restart docker
        docker info -f '{{ .DriverStatus }}'

    - name: Load binfmt platforms for QEMU
      run: |
        docker run --privileged --rm tonistiigi/binfmt --install all
        docker images --tree

    - name: Checkout source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Build docker image for ${{ env.VERSION }} ${{ env.VARIANT }}
      run: make test
