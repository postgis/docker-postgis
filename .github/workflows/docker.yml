name: Build and publish PostGIS images

on:
  push:
    branches:
      - master
  pull_request:
  schedule:
    - cron: '15 5 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Test images or publish them after native tests pass
        type: choice
        options: [test, release]
        default: test
      image:
        description: Optional image tag, such as 18-3.7 or 18-3.7-alpine
        type: string
        required: false

concurrency:
  group: docker-postgis-${{ github.workflow }}-${{ github.event_name == 'schedule' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  BUILDX_VERSION: v0.39.1
  BUILDKIT_IMAGE: docker.io/moby/buildkit:buildx-stable-1@sha256:baf6138eb8c37644800c7c913fba051e840ebb9ba13eaf92d92ef9a1712d0b4c
  SBOM_GENERATOR: docker.io/docker/buildkit-syft-scanner:stable-1@sha256:873a7458c3c8ac8e32c7b796c10e1600b07b963d2aa000a72a2d97aaaa2d6315

# Rebuild tags when their inputs change or their PostgreSQL base is newer.
# Stop scheduled releases when update or registry metadata is unavailable.
# Skip changes to blank lines, comments, and documentation.
# Build and test each architecture on a matching runner, then check both results.
jobs:
  versions:
    name: Discover Docker image versions
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    concurrency:
      group: postgis-discovery-${{ github.event_name == 'schedule' && github.ref || github.run_id }}
      cancel-in-progress: false
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      images: ${{ steps.matrix.outputs.images }}
      latest_version: ${{ steps.matrix.outputs.latest_version }}
      has_images: ${{ steps.matrix.outputs.has_images }}
      has_master_images: ${{ steps.matrix.outputs.has_master_images }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Run local regression tests
        run: |
          nice -n 10 bash test/update-warnings.sh
          nice -n 10 bash test/make-image.sh
          nice -n 10 python3 test/image-contracts.py
          nice -n 10 python3 test/workflow-selection.py
          nice -n 10 python3 test/oci-evidence.py
          nice -n 10 python3 test/update-policy.py
      - name: Restore update candidate state
        if: github.event_name == 'schedule'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/postgis-update-state.json
          key: postgis-update-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: postgis-update-state-
      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        id: update
        name: Regenerate Dockerfile inputs
        continue-on-error: true
        run: |
          patch="$RUNNER_TEMP/dockerfiles-update.patch"
          success="$RUNNER_TEMP/dockerfiles-update.success"
          : > "$patch"
          printf 'false\n' > "$success"
          if ! ./update.sh; then
            git restore --source=HEAD --worktree --staged .
            git clean -fd
            exit 1
          fi
          git add -N .
          git diff --binary HEAD -- > "$patch"
          printf 'true\n' > "$success"
      - if: ${{ always() && (github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')) }}
        name: Share generated Dockerfile updates
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scheduled-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/dockerfiles-update.patch
            ${{ runner.temp }}/dockerfiles-update.success
          if-no-files-found: error
          retention-days: 30
      - id: matrix
        name: Select affected Docker images
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          UPDATE_SCRIPT_OUTCOME: ${{ steps.update.outcome }}
          DISPATCH_IMAGE: ${{ inputs.image }}
          DISPATCH_MODE: ${{ inputs.mode }}
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import re
          import subprocess
          import sys
          import time
          from concurrent.futures import ThreadPoolExecutor
          from datetime import datetime
          from pathlib import Path
          from pathlib import PurePosixPath
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          dockerfiles = {path.parent.name: path for path in Path(".").glob("*/Dockerfile")}
          selected = set()
          platforms = ("linux/amd64", "linux/arm64")
          runners = {"linux/amd64": "ubuntu-24.04", "linux/arm64": "ubuntu-24.04-arm"}

          def is_source_built(dockerfile):
              if not dockerfile.is_file():
                  return False
              contents = dockerfile.read_text()
              return "AS postgis-build" in contents or "POSTGIS_SOURCE_VERSION=" in contents

          def is_experimental(version, dockerfile):
              postgis_versions = re.findall(r"(?m)^(?:ARG|ENV) POSTGIS_(?:SOURCE_)?VERSION=([^\s]+)", dockerfile.read_text())
              return any(re.search(r"alpha|beta|rc|master", value, re.I) for value in (version, *postgis_versions))

          def add_target(version, variant):
              dockerfile = dockerfiles.get(version)
              if dockerfile is None:
                  return
              if variant == "alpine":
                  dockerfile = dockerfile.parent / "alpine" / "Dockerfile"
              if dockerfile.is_file():
                  selected.add((version, variant))

          def add_version_file_target(changed_path):
              parts = PurePosixPath(changed_path).parts
              if parts and parts[0] in dockerfiles:
                  variant = "alpine" if len(parts) > 1 and parts[1] == "alpine" else "default"
                  add_target(parts[0], variant)
                  return parts[0], variant
              return None

          event_name = os.environ["EVENT_NAME"]
          ref = os.environ["REF"]
          all_targets = {
              (version, variant)
              for version, dockerfile in dockerfiles.items()
              for variant, candidate in (
                  ("default", dockerfile),
                  ("alpine", dockerfile.parent / "alpine" / "Dockerfile"),
              )
              if candidate.is_file()
          }

          def postgres_base_tags(dockerfile):
              contents = dockerfile.read_text()
              tags = set(re.findall(
                  r"(?m)^\s*(?:FROM\s+(?:docker\.io/)?postgres:|ARG\s+BASE_IMAGE=(?:docker\.io/)?postgres:)([^\s]+)",
                  contents,
              ))
              if not tags:
                  raise RuntimeError(f"cannot find a Postgres base tag in {dockerfile}")
              return tags

          def dockerhub_last_updated(namespace, repository, tag):
              url = (
                  "https://hub.docker.com/v2/repositories/"
                  f"{namespace}/{repository}/tags/{quote(tag, safe='')}/"
              )
              request = Request(url, headers={"User-Agent": "docker-postgis-ci"})
              for attempt in range(3):
                  try:
                      with urlopen(request, timeout=20) as response:
                          metadata = json.load(response)
                      value = metadata.get("tag_last_pushed") or metadata.get("last_updated")
                      if not value:
                          if namespace == "postgis":
                              return None
                          raise RuntimeError(f"Docker Hub returned no last_updated for {repository}:{tag}")
                      return datetime.fromisoformat(value.replace("Z", "+00:00"))
                  except HTTPError as error:
                      if error.code == 404 and namespace == "postgis":
                          return None
                      if attempt == 2:
                          raise RuntimeError(f"Docker Hub metadata lookup failed for {repository}:{tag}: {error}") from error
                  except Exception as error:
                      if attempt == 2:
                          raise RuntimeError(f"Docker Hub metadata lookup failed for {repository}:{tag}: {error}") from error
                  time.sleep((attempt + 1) * 2)

          def meaningful_diff(diff):
              for line in diff.splitlines():
                  if line.startswith(("new file mode ", "deleted file mode ", "old mode ", "new mode ")):
                      return True
                  if not line.startswith(("+", "-")) or line.startswith(("+++", "---")):
                      continue
                  content = line[1:].strip()
                  if not content:
                      continue
                  if content.startswith(("#!", "# syntax=", "# escape=")):
                      return True
                  if content.startswith(("#", "//", "/*", "*/", "* ")):
                      continue
                  return True
              return False

          def meaningful_worktree_change(path):
              if PurePosixPath(path).suffix.lower() in {".md", ".rst", ".adoc"}:
                  return False
              diff = subprocess.check_output(
                  [
                      "git", "diff", "--no-ext-diff",
                      "--ignore-blank-lines", "--unified=0", "HEAD", "--", path,
                  ],
                  text=True,
              )
              return meaningful_diff(diff)

          def meaningful_commit_after(paths, timestamp):
              commits = subprocess.check_output(
                  ["git", "log", "--first-parent", "--full-history", "--format=%H%x09%ct", "HEAD", "--", *paths],
                  text=True,
              ).splitlines()
              for record in commits:
                  commit, committed_at = record.split("\t", 1)
                  if int(committed_at) <= timestamp:
                      continue
                  try:
                      parent = subprocess.check_output(
                          ["git", "rev-parse", f"{commit}^1"], text=True, stderr=subprocess.DEVNULL
                      ).strip()
                  except subprocess.CalledProcessError:
                      parent = subprocess.check_output(
                          ["git", "hash-object", "-t", "tree", "-w", "/dev/null"], text=True
                      ).strip()
                  diff = subprocess.check_output(
                      [
                          "git", "diff", "--no-ext-diff", "--no-renames",
                          "--ignore-blank-lines", "--unified=0",
                          parent, commit, "--", *paths,
                      ],
                      text=True,
                  )
                  if meaningful_diff(diff):
                      return True
              return False

          shared_build_inputs = (
              ".dockerignore",
              "Dockerfile.alpine.template",
              "Dockerfile.master.template",
              "Dockerfile.source.template",
              "Dockerfile.template",
              "docker-bake.hcl",
              "initdb-postgis.sh",
              "update-postgis.sh",
          )

          def target_build_inputs(target):
              version, variant = target
              version_dir = dockerfiles[version].parent
              if variant == "alpine":
                  return [str(version_dir / "alpine" / "Dockerfile"), str(version_dir / "alpine" / "pgrouting-version.txt")]
              return [str(dockerfiles[version])]

          def stale_targets_from_base_updates(targets):
              image_tags = {}
              bases = {}
              lookups = set()
              for version, variant in targets:
                  dockerfile = dockerfiles[version]
                  if variant == "alpine":
                      dockerfile = dockerfile.parent / "alpine" / "Dockerfile"
                  image_tag = version + ("-alpine" if variant == "alpine" else "")
                  image_tags[(version, variant)] = image_tag
                  bases[(version, variant)] = postgres_base_tags(dockerfile)
                  lookups.update(("library", "postgres", tag) for tag in bases[(version, variant)])
                  lookups.add(("postgis", "postgis", image_tag))

              keys = sorted(lookups)
              with ThreadPoolExecutor(max_workers=12) as executor:
                  timestamps = dict(zip(keys, executor.map(lambda key: dockerhub_last_updated(*key), keys)))

              stale = set()
              for target, image_tag in image_tags.items():
                  image_updated = timestamps[("postgis", "postgis", image_tag)]
                  base_is_newer = any(
                      timestamps[("library", "postgres", base_tag)] > image_updated
                      for base_tag in bases[target]
                  ) if image_updated is not None else False
                  if image_updated is None:
                      stale.add(target)
                      print(f"Scheduled rebuild: {image_tag} is missing or has no push time", file=sys.stderr)
                  elif base_is_newer:
                      stale.add(target)
                      print(f"Scheduled rebuild: Postgres base for {image_tag} was pushed later", file=sys.stderr)
                  elif meaningful_commit_after(target_build_inputs(target), image_updated.timestamp()):
                      stale.add(target)
                      print(f"Scheduled rebuild: build inputs for {image_tag} changed after its last push", file=sys.stderr)

              published_times = [
                  timestamps[("postgis", "postgis", image_tag)].timestamp()
                  for image_tag in image_tags.values()
                  if timestamps[("postgis", "postgis", image_tag)] is not None
              ]
              if published_times and meaningful_commit_after(shared_build_inputs, min(published_times)):
                  stale.update(targets)
                  print("Scheduled rebuild: shared build inputs changed; rebuilding all eligible tags", file=sys.stderr)
              return stale

          if event_name == "push" and ref == "refs/heads/master":
              for version in dockerfiles:
                  if version.endswith("-master"):
                      add_target(version, "default")
                      add_target(version, "alpine")
          elif event_name == "schedule":
              if os.environ.get("UPDATE_SCRIPT_OUTCOME") != "success":
                  raise SystemExit("update.sh failed; no release candidates selected")
              else:
                  generated_changes = subprocess.check_output(
                      ["git", "diff", "--name-only", "--no-renames", "HEAD"],
                      text=True,
                  ).splitlines()
                  for changed_path in generated_changes:
                      if not meaningful_worktree_change(changed_path):
                          continue
                      target = add_version_file_target(changed_path)
                      if target is not None and target in selected:
                          version, variant = target
                          image_tag = version + ("-alpine" if variant == "alpine" else "")
                          print(f"Scheduled rebuild: generated inputs changed for {image_tag}", file=sys.stderr)
                  try:
                      selected.update(stale_targets_from_base_updates(all_targets))
                  except Exception as error:
                      raise SystemExit(f"cannot compare Docker Hub tag dates: {error}") from error
          elif event_name == "workflow_dispatch":
              if os.environ.get("DISPATCH_MODE") == "release" and os.environ.get("UPDATE_SCRIPT_OUTCOME") != "success":
                  raise SystemExit("update.sh failed; manual release stopped")
              image = os.environ.get("DISPATCH_IMAGE", "").strip()
              if image:
                  selected.update((version, variant) for version, variant in all_targets
                                  if version + ("-alpine" if variant == "alpine" else "") == image)
                  if not selected:
                      raise SystemExit(f"unknown image tag: {image}")
              else:
                  selected.update(all_targets)
          elif event_name == "pull_request":
              base_sha = os.environ.get("PR_BASE_SHA", "")
              if not base_sha:
                  raise SystemExit("pull request base SHA is unavailable")
              changed = subprocess.check_output(
                  ["git", "diff", "--name-only", "--no-renames", f"{base_sha}...HEAD"],
                  text=True,
              ).splitlines()
              for changed_path in changed:
                  if PurePosixPath(changed_path).suffix.lower() in {".md", ".rst", ".adoc"}:
                      continue
                  diff = subprocess.check_output(
                      [
                          "git", "diff", "--no-ext-diff", "--no-renames",
                          "--ignore-blank-lines", "--unified=0",
                          f"{base_sha}...HEAD", "--", changed_path,
                      ],
                      text=True,
                  )
                  if not meaningful_diff(diff):
                      continue
                  parts = PurePosixPath(changed_path).parts
                  if add_version_file_target(changed_path) is not None:
                      continue
                  elif changed_path in {"docker-bake.hcl", ".dockerignore", "initdb-postgis.sh", "update-postgis.sh", "test/postgis-config.sh", ".github/scripts/oci-evidence.py"} or changed_path.startswith("test/tests/"):
                      selected.update(all_targets)
                  elif changed_path == "Dockerfile.template":
                      selected.update(
                          target for target in all_targets
                          if target[1] == "default" and not target[0].endswith("-master")
                          and not is_source_built(dockerfiles[target[0]])
                      )
                  elif changed_path == "Dockerfile.source.template":
                      selected.update(
                          target for target in all_targets
                          if target[1] == "default" and not target[0].endswith("-master")
                          and is_source_built(dockerfiles[target[0]])
                      )
                  elif changed_path == "Dockerfile.alpine.template":
                      selected.update(target for target in all_targets if target[1] == "alpine")
                  elif changed_path == "Dockerfile.master.template":
                      selected.update(target for target in all_targets if target[1] == "default" and target[0].endswith("-master"))
                  elif not parts or parts[0] not in {
                      ".circleci", ".github", "examples", "test",
                  } and changed_path not in {
                      ".coderabbit.yaml", "AUTHORS", "LICENSE", "Makefile", "README.md",
                      "apply-readme.sh", "update.sh",
                  }:
                      selected.update(all_targets)

          latest_match = re.search(r"(?m)^LATEST_VERSION\s*=\s*(\S+)\s*$", Path("Makefile").read_text())
          if not latest_match:
              raise SystemExit("Makefile does not define LATEST_VERSION")
          latest_version = latest_match.group(1)
          if (latest_version, "default") not in all_targets:
              raise SystemExit(f"latest image {latest_version} is not buildable")
          security_targets = set()
          if event_name == "schedule":
              import importlib.util
              spec = importlib.util.spec_from_file_location("update_policy", ".github/scripts/update-policy.py")
              policy = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(policy)
              state_file = Path("/tmp/postgis-update-state.json")
              state = json.loads(state_file.read_text()) if state_file.exists() else {}
              # A successful workflow can include skipped experimental images.
              job_cache = {}
              def previous_status(run_id, image_name):
                  if run_id not in job_cache:
                      run = policy.request_json(
                          f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}",
                          token=os.environ.get("GH_TOKEN"))
                      jobs = []
                      if run["status"] == "completed":
                          page = 1
                          while True:
                              result = policy.request_json(
                                  f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}/jobs?per_page=100&page={page}",
                                  token=os.environ.get("GH_TOKEN"))
                              jobs.extend(result["jobs"])
                              if len(result["jobs"]) < 100:
                                  break
                              page += 1
                      job_cache[run_id] = (run, jobs)
                  return policy.published_status(*job_cache[run_id], image_name)
              chosen = set()
              for version, variant in sorted(selected):
                  path = dockerfiles[version] if variant == "default" else dockerfiles[version].parent / "alpine/Dockerfile"
                  base_times = {tag: dockerhub_last_updated("library", "postgres", tag).isoformat()
                                for tag in postgres_base_tags(path)}
                  fingerprint = policy.candidate_fingerprint(version, variant, base_times)
                  if policy.select_candidate(state, version + "/" + variant, fingerprint, os.environ["RUN_ID"],
                                             lambda run_id: previous_status(run_id, version + "-" + variant)):
                      chosen.add((version, variant))
              selected = chosen
              state_file.write_text(json.dumps(state, sort_keys=True))
          elif event_name == "workflow_dispatch" and os.environ.get("DISPATCH_MODE") == "release":
              security_targets = set(selected)

          images = []
          include = []
          for version, variant in sorted(selected):
              dockerfile = dockerfiles[version]
              if variant == "alpine":
                  dockerfile = dockerfile.parent / "alpine" / "Dockerfile"
              image = {"version": version, "variant": variant, "experimental": is_experimental(version, dockerfile),
                       "security": (version, variant) in security_targets}
              images.append(image)
              for platform in platforms:
                  scope = f"postgis-{version}-{variant}-{platform.replace('/', '-')}"
                  include.append({**image, "platform": platform, "runner": runners[platform], "cache_scope": scope, "master_deps_cache_scope": f"postgis-master-deps-{platform.replace('/', '-')}"})
          if event_name == "schedule":
              for image in images:
                  image_tag = image["version"] + ("-alpine" if image["variant"] == "alpine" else "")
                  print(f"Selected image tag: postgis/postgis:{image_tag}", file=sys.stderr)
          print("matrix=" + json.dumps({"include": include}, separators=(",", ":")))
          print("images=" + json.dumps({"include": images}, separators=(",", ":")))
          print("latest_version=" + latest_version)
          print("has_images=" + str(bool(images)).lower())
          print("has_master_images=" + str(any(image["version"].endswith("-master") for image in images)).lower())
          PY

      - name: Save update candidate state
        if: github.event_name == 'schedule'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/postgis-update-state.json
          key: postgis-update-state-${{ github.run_id }}-${{ github.run_attempt }}

  master-deps:
    name: Cache Debian master dependencies ${{ matrix.platform }}
    needs: [versions]
    if: ${{ needs.versions.outputs.has_master_images == 'true' && (github.event_name == 'schedule' || (github.event_name == 'push' && github.ref == 'refs/heads/master')) }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            cache_scope: postgis-master-deps-linux-amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            cache_scope: postgis-master-deps-linux-arm64
    env:
      VERSION: 16-master
      VARIANT: default
      PLATFORMS: ${{ matrix.platform }}
      GHA_CACHE: "true"
      CACHE_FROM_SCOPES: ${{ matrix.cache_scope }}
      CACHE_TO_SCOPE: ${{ matrix.cache_scope }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        name: Download generated Dockerfile updates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scheduled-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dockerfiles-update

      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        name: Apply generated Dockerfile updates
        run: |
          patch="$RUNNER_TEMP/dockerfiles-update/dockerfiles-update.patch"
          success="$RUNNER_TEMP/dockerfiles-update/dockerfiles-update.success"
          if [[ "$(cat "$success")" == "true" && -s "$patch" ]]; then
            git apply "$patch"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build shared master dependency stage
        id: bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: master-deps
          pull: true

      - if: steps.bake.outcome == 'failure'
        name: Retry shared master dependency stage
        run: |
          for attempt in 1 2 3; do
            if docker buildx bake --allow fs=* --file docker-bake.hcl --pull master-deps; then
              exit 0
            fi
            echo "Bake failed (attempt ${attempt}/3); retrying" >&2
            sleep $((attempt * 5))
          done
          exit 1

  build:
    name: ${{ matrix.version }}-${{ matrix.variant }} ${{ matrix.platform }}
    needs: [versions, master-deps]
    if: ${{ always() && needs.versions.outputs.has_images == 'true' }}
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.versions.outputs.matrix) }}
    env:
      VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
      LATEST_VERSION: ${{ needs.versions.outputs.latest_version }}
      EXPECTED_TAG: postgis/postgis:${{ matrix.version }}${{ matrix.variant == 'alpine' && '-alpine' || '' }}
      PLATFORM_SLUG: ${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
      OCI_LAYOUT: /tmp/postgis-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.oci.tar
      EVIDENCE: /tmp/postgis-${{ matrix.version }}-${{ matrix.variant }}-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}.json
      GHA_CACHE: "true"
      CACHE_FROM_SCOPES: ${{ matrix.cache_scope }},${{ matrix.master_deps_cache_scope }}
      CACHE_TO_SCOPE: ${{ matrix.cache_scope }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        name: Download generated Dockerfile updates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scheduled-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dockerfiles-update

      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        name: Apply generated Dockerfile updates
        run: |
          patch="$RUNNER_TEMP/dockerfiles-update/dockerfiles-update.patch"
          success="$RUNNER_TEMP/dockerfiles-update/dockerfiles-update.success"
          if [[ "$(cat "$success")" == "true" && -s "$patch" ]]; then
            git apply "$patch"
          fi

      - name: Enable the containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Build native image with attestations
        id: bake
        continue-on-error: true
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          files: docker-bake.hcl
          targets: image
          pull: true
          provenance: mode=max
          sbom: generator=${{ env.SBOM_GENERATOR }}
          set: |
            image.platform=${{ matrix.platform }}
            image.tags=${{ env.EXPECTED_TAG }}
            image.output=type=oci,dest=${{ env.OCI_LAYOUT }}

      - if: steps.bake.outcome == 'failure'
        name: Retry native image build
        run: |
          for attempt in 1 2 3; do
            if docker buildx bake --allow fs=* --file docker-bake.hcl --set image.platform=${{ matrix.platform }} \
              --set "image.tags=$EXPECTED_TAG" --set "image.output=type=oci,dest=$OCI_LAYOUT" \
              --pull --provenance=mode=max --sbom="generator=$SBOM_GENERATOR" image; then
              exit 0
            fi
            echo "Bake failed (attempt ${attempt}/3); retrying" >&2
            sleep $((attempt * 5))
          done
          exit 1

      - name: Load and verify the image to test
        run: |
          docker load --input "$OCI_LAYOUT"
          image_id="$(docker image inspect --format '{{.Id}}' "$EXPECTED_TAG")"
          python3 .github/scripts/oci-evidence.py "$OCI_LAYOUT" "$EVIDENCE" "$EXPECTED_TAG" "$PLATFORM_SLUG" "$image_id"

      - name: Run official-images tests
        run: |
          tests="$RUNNER_TEMP/official-images"
          make test-prepare OFFIMG_LOCAL_CLONE="$tests"
          "$tests/test/run.sh" \
            -c "$tests/test/config.sh" \
            -c test/postgis-config.sh \
            "$EXPECTED_TAG"

      - name: Upload native OCI evidence
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgis-evidence-${{ matrix.version }}-${{ matrix.variant }}-${{ env.PLATFORM_SLUG }}
          path: ${{ env.EVIDENCE }}
          if-no-files-found: error
          retention-days: ${{ matrix.security && 30 || 7 }}

      - name: Upload tested OCI image
        if: ${{ github.repository == 'postgis/docker-postgis' && (github.event_name == 'schedule' || (github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')))) }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: postgis-image-${{ matrix.version }}-${{ matrix.variant }}-${{ env.PLATFORM_SLUG }}
          path: ${{ env.OCI_LAYOUT }}
          compression-level: 0
          if-no-files-found: error
          retention-days: ${{ matrix.security && 30 || 7 }}

  verify-build:
    name: Verify native image evidence
    needs: [versions, build]
    if: ${{ !cancelled() && needs.versions.outputs.has_images == 'true' }}
    runs-on: ubuntu-24.04
    outputs:
      images: ${{ steps.verify.outputs.images }}
      has_images: ${{ steps.verify.outputs.has_images }}
    steps:
      - name: Download native OCI evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: postgis-evidence-*
          path: evidence

      - name: Check native platform evidence
        id: verify
        env:
          IMAGES: ${{ needs.versions.outputs.images }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          import pathlib
          import sys

          def verify(image):
              version, variant = image["version"], image["variant"]
              expected_tag = f"postgis/postgis:{version}" + ("-alpine" if variant == "alpine" else "")
              paths = pathlib.Path("evidence").glob(f"postgis-evidence-{version}-{variant}-*/*.json")
              evidence = [json.loads(path.read_text()) for path in paths]
              expected = {("linux", "amd64"), ("linux", "arm64")}
              actual = {tuple(item["platform"]) for item in evidence}
              if len(evidence) != 2 or actual != expected:
                  raise ValueError(f"unexpected native platforms: {sorted(actual)}")
              if {item["tag"] for item in evidence} != {expected_tag}:
                  raise ValueError("native evidence has inconsistent image tags")
              for item in evidence:
                  if not item["index"].get("digest", "").startswith("sha256:") or not item["attestations"]:
                      raise ValueError("native image has no index or attestations")
                  if not item["manifest"].get("digest", "").startswith("sha256:"):
                      raise ValueError("native manifest has no digest")
                  if not item["config"].get("digest", "").startswith("sha256:"):
                      raise ValueError("native config has no digest")
                  if not item["layers"]:
                      raise ValueError("native image has no layers")

          verified = []
          for image in json.loads(os.environ["IMAGES"])["include"]:
              try:
                  verify(image)
              except (ValueError, KeyError, TypeError, OSError) as error:
                  if not image["experimental"]:
                      raise
                  print(f"::warning::Skipping experimental {image['version']}-{image['variant']}: {error}", file=sys.stderr)
              else:
                  verified.append(image)
          print("images=" + json.dumps({"include": verified}, separators=(",", ":")))
          print("has_images=" + str(bool(verified)).lower())
          PY

  release-policy:
    name: Check release protection rules
    needs: [versions, verify-build]
    if: ${{ !cancelled() && needs.verify-build.outputs.has_images == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - name: Checkout policy
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require configured protection for releases
        if: ${{ github.repository == 'postgis/docker-postgis' && (github.event_name == 'schedule' || (github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')))) }}
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ needs.verify-build.outputs.images }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/check-release-policy.py

  publish:
    name: Publish ${{ matrix.version }}-${{ matrix.variant }}
    needs: [versions, verify-build, release-policy]
    permissions:
      contents: read
      actions: read
      id-token: write
    if: ${{ needs.verify-build.outputs.has_images == 'true' && github.repository == 'postgis/docker-postgis' && (github.event_name == 'schedule' || (github.ref == 'refs/heads/master' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release')))) }}
    runs-on: ubuntu-24.04
    environment: ${{ matrix.security && 'postgis-security' || (github.event_name == 'schedule' && 'postgis-routine' || 'postgis-manual') }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-build.outputs.images) }}
    env:
      VERSION: ${{ matrix.version }}
      VARIANT: ${{ matrix.variant }}
      DOCKERHUB_REPOSITORY: postgis/postgis
      LATEST_VERSION: ${{ needs.versions.outputs.latest_version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        name: Download generated Dockerfile updates
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: scheduled-update-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dockerfiles-update

      - if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        name: Apply generated Dockerfile updates
        run: |
          patch="$RUNNER_TEMP/dockerfiles-update/dockerfiles-update.patch"
          success="$RUNNER_TEMP/dockerfiles-update/dockerfiles-update.success"
          if [[ "$(cat "$success")" == "true" && -s "$patch" ]]; then
            git apply "$patch"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          version: ${{ env.BUILDX_VERSION }}
          driver-opts: image=${{ env.BUILDKIT_IMAGE }}

      - name: Download tested OCI images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: postgis-image-${{ matrix.version }}-${{ matrix.variant }}-*
          path: images

      - name: Download verified image evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: postgis-evidence-${{ matrix.version }}-${{ matrix.variant }}-*
          path: evidence

      - name: Install OCI image copy tool
        run: |
          sudo apt-get update
          sudo apt-get install -y skopeo

      - name: Recheck release protection after waiting
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGES: ${{ needs.verify-build.outputs.images }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 .github/scripts/check-release-policy.py

      - name: Check that the candidate is still current
        if: ${{ github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'release') }}
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .github/scripts/check-current-candidate.py

      - name: Login to Docker Hub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: postgis
        env:
          DOCKERHUB_OIDC_CONNECTIONID: ${{ vars.DOCKERHUB_OIDC_CONNECTIONID }}

      - name: Publish tested native images and combine their digests
        run: |
          set -euo pipefail
          image_tag="$VERSION"
          if [[ "$VARIANT" == alpine ]]; then image_tag+="-alpine"; fi
          sources=()
          for arch in amd64 arm64; do
            archive="images/postgis-image-${VERSION}-${VARIANT}-${arch}/postgis-${VERSION}-${VARIANT}-${arch}.oci.tar"
            evidence="evidence/postgis-evidence-${VERSION}-${VARIANT}-${arch}/postgis-${VERSION}-${VARIANT}-${arch}.json"
            expected="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["index"]["digest"])' "$evidence")"
            candidate="${DOCKERHUB_REPOSITORY}@${expected}"
            skopeo copy --all --preserve-digests --dest-authfile "$HOME/.docker/config.json" \
              --digestfile "$RUNNER_TEMP/${arch}.digest" "oci-archive:${archive}" "docker://${candidate}"
            actual="$(cat "$RUNNER_TEMP/${arch}.digest")"
            if [[ "$actual" != "$expected" ]]; then
              echo "OCI digest differs from tested ${arch} image" >&2
              exit 1
            fi
            sources+=("${DOCKERHUB_REPOSITORY}@${actual}")
          done
          tags=(-t "${DOCKERHUB_REPOSITORY}:${image_tag}")
          if [[ "$VERSION" == "$LATEST_VERSION" && "$VARIANT" == default ]]; then
            tags+=(-t "${DOCKERHUB_REPOSITORY}:latest")
          fi
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"

      - name: Check Docker Hub description credentials
        id: description-credentials
        if: ${{ matrix.version == env.LATEST_VERSION && matrix.variant == 'default' }}
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_ACCESS_TOKEN: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
        run: |
          if [[ -z "$DOCKERHUB_USERNAME" && -z "$DOCKERHUB_ACCESS_TOKEN" ]]; then
            exit 0
          fi
          if [[ -z "$DOCKERHUB_USERNAME" || -z "$DOCKERHUB_ACCESS_TOKEN" ]]; then
            echo "Set both Docker Hub description credentials or remove both to skip the update." >&2
            exit 1
          fi
          echo 'configured=true' >> "$GITHUB_OUTPUT"

      - name: Update Docker Hub description
        if: steps.description-credentials.outputs.configured == 'true'
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_ACCESS_TOKEN }}
          repository: ${{ env.DOCKERHUB_REPOSITORY }}

  verify-published:
    name: Verify published ${{ matrix.version }}-${{ matrix.variant }}
    needs: [verify-build, publish]
    if: ${{ !cancelled() && needs.verify-build.outputs.has_images == 'true' && (needs.publish.result == 'success' || needs.publish.result == 'failure') }}
    runs-on: ubuntu-24.04
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.verify-build.outputs.images) }}
    env:
      EXPECTED_TAG: postgis/postgis:${{ matrix.version }}${{ matrix.variant == 'alpine' && '-alpine' || '' }}
    steps:
      - name: Download verified image evidence
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: postgis-evidence-${{ matrix.version }}-${{ matrix.variant }}-*
          path: evidence

      - name: Verify Docker Hub manifest
        run: |
          for attempt in 1 2 3 4 5; do
            if raw="$(docker buildx imagetools inspect --raw "$EXPECTED_TAG" 2>/dev/null)" && [[ -n "$raw" ]]; then
              RAW_JSON="$raw" python3 - "$EXPECTED_TAG" <<'PY'
          import json
          import os
          import pathlib
          import sys

          expected_tag = sys.argv[1]
          index = json.loads(os.environ["RAW_JSON"])
          expected = {("linux", "amd64"), ("linux", "arm64")}
          manifests = [
              descriptor for descriptor in index.get("manifests", [])
              if descriptor.get("annotations", {}).get("vnd.docker.reference.type") != "attestation-manifest"
          ]
          platforms = [
              (descriptor.get("platform", {}).get("os"), descriptor.get("platform", {}).get("architecture"))
              for descriptor in manifests
          ]
          if len(manifests) != 2 or set(platforms) != expected:
              raise SystemExit(f"unexpected published platforms for {expected_tag}: {platforms}")
          evidence = [json.loads(path.read_text()) for path in pathlib.Path("evidence").glob("*/*.json")]
          if len(evidence) != 2:
              raise SystemExit("missing tested image evidence")
          actual = {item["digest"] for item in index["manifests"]}
          expected_digests = {item["manifest"]["digest"] for item in evidence}
          expected_digests.update(digest for item in evidence for digest in item["attestations"])
          if not expected_digests <= actual:
              raise SystemExit("published image or attestations do not match the tested images")
          print(f"{expected_tag}: tested linux/amd64 and linux/arm64 images with attestations")
          PY
              exit 0
            fi
            echo "Docker Hub manifest not ready (attempt ${attempt}/5)" >&2
            sleep $((attempt * 10))
          done
          exit 1
